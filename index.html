<script>
"use strict";
/* ============================================================
   MERGED AUDITION — Touring chassis + Tonal option span
   Chassis: 99-dot sequencer — every dot blinks at an integer
   harmonic of the loop frequency (h in {2,3,4,6,8,12}, dealt
   freely per dot), peaks phase-locked to the 24-tick grid, top-2
   strikes per tick, production pluck + 40ms flam + heartbeat
   swell + path filler, harmony presets (weighted), 2-chord vamp
   (change on tick 12), audition bass.
   Folded in (tonal-audition): Interval Path + Contour + States as
   the melody source (dots trigger, path orders the pitches), Second
   Voice locked to Fifth above, Loop 27/36/45/54s, Root (12),
   Octave band (C3/C4/C5), Voices (Pluck / Throat Song / Both).
   Tuning is locked to Pythagorean.
   ============================================================ */

function xmur3(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cyrb53(str,seed){var h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function randHash(){var s="",c="0123456789abcdef";for(var i=0;i<64;i++)s+=c[Math.floor(Math.random()*16)];return s;}

/* ---------- tables ---------- */
var PRESETS=[
 {n:"Sunline",       w:35, iv:[0,2,4,7,9],          names:"D E F# A B",       vamp:[0,9], vampN:"I–vi",  flat:false},
 {n:"Lydian lift",   w:20, iv:[0,2,4,6,7,9,11],     names:"D E F# G# A B C#", vamp:[0,2], vampN:"I–II",  flat:false},
 {n:"Hirajoshi dusk",w:15, iv:[0,2,3,7,8],          names:"D E F A Bb",       vamp:[0,8], vampN:"i–bVI", flat:true},
 {n:"Hijaz fire",    w:12, iv:[0,1,4,5,7,8,10],     names:"D Eb F# G A Bb C", vamp:[0,1], vampN:"i–bII", flat:true},
 {n:"Overtone",      w:8,  iv:[0,2,4,6,7,9,10],     names:"D E F# G# A B C",  vamp:[0,7], vampN:"I7–V7", flat:false},
 {n:"Byzantine",     w:6,  iv:[0,1,4,5,7,8,11],     names:"D Eb F# G A Bb C#",vamp:[0,1], vampN:"i–bII", flat:true},
 {n:"Slendro haze",  w:4,  cents:[0,240,480,720,960],names:"slendro 5-TET",   vamp:[0,9], vampN:"I–vi",  flat:false, lockTuning:true}
];
var TUNINGS=["12-TET","5-Limit Just","Pythagorean","¼-Comma Meantone"];
var PATHS=[
 {n:"Arpeggio",       gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(2*i);return s;}},
 {n:"Stepwise Rise",  gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(i);return s;}},
 {n:"Stepwise Fall",  gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(N-1-i);return s;}},
 {n:"Pedal Tone",     gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(i%2===0?0:(i+1)/2);return s;}},
 {n:"Fifths Ladder",  gen:function(N,L,iv){var s=[];for(var i=0;i<N;i++)s.push(nearestDeg(7*i,L,iv));return s;}},
 {n:"Valley",         gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(Math.abs(N-1-2*i));return s;}},
 {n:"Wave",           gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(Math.round(2+2*Math.sin(2*Math.PI*i/N)));return s;}},
 {n:"Zigzag",         gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(i%2===0?i/2:3+(i-1)/2);return s;}},
 {n:"Plateau",        gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(Math.floor(i/2));return s;}},
 {n:"Expander",       gen:function(N){var s=[];for(var i=0;i<N;i++)s.push(i*(i+1)/2);return s;}},
 {n:"Random Walk",    gen:function(N){var rnd=mulberry32(xmur3(hash+"walk")()),s=[],d=2;for(var i=0;i<N;i++){s.push(d);d=Math.max(0,d+(rnd()<0.5?-1:1)*(rnd()<0.3?2:1));}return s;}}
];
function nearestDeg(semi,L,iv){
  var best=0,bd=1e9;
  for(var o=-1;o<=4;o++)for(var d=0;d<L;d++){
    var v=iv[d]+12*o, dd=Math.abs(v-semi);
    if(dd<bd){bd=dd;best=d+o*L;}
  }
  return best;
}
var SECONDS_T=[
 {n:"Degree down",  f:function(d,j){return d-1;}},
 {n:"Third above",  f:function(d,j){return d+2;}},
 {n:"Fifth above",  f:function(d,j){return d+4;}},
 {n:"Third below",  f:function(d,j){return d-2;}},
 {n:"Alternate",    f:function(d,j){return j%2===0?d+2:d-1;}}
];
var VOICES=["Pluck","Throat Song","Both"];
var LOOPS=[27,36,45];
var NAMES_S=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var NAMES_F=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
var RING_N=[12,33,33,21], RING_R=[0.17,0.40,0.60,0.82];
/* Tidal Geometries' six neon dot colors — the accent field, fixed across that series */
var DOT_COLORS=["#b6ff00","#00ff66","#00f0ff","#2e6bff","#8b2bff","#ff2bd6"];
var PRESET_COLORS=["#b6ff00","#00ff66","#00f0ff","#2e6bff","#8b2bff","#ff2bd6","#b6ff00"];
function hexA(hx,a){var n=parseInt(hx.slice(1),16);return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";}

/* ---------- tuning: root-relative, degrees spelled per root ----------
   Each scale degree keeps its letter (from the preset's note names), so
   its position in the fifth stack is solved per root: 7k = semitones
   (mod 12) and 4k = letter steps (mod 7). A major third is therefore
   81/64 from EVERY root, a minor 2nd the 90.22c limma, a minor 7th
   16/9 — spelling follows the scale, not a fixed pitch-class table. */
var LETTERS="CDEFGAB";
PRESETS.forEach(function(p){
  if(!p.iv)return;
  var toks=p.names.split(" "), base=LETTERS.indexOf(toks[0].charAt(0));
  p.letOff=toks.map(function(tk){return (LETTERS.indexOf(tk.charAt(0))-base+7)%7;});
});
var JUST_R={0:1,1:16/15,2:9/8,3:6/5,4:5/4,5:4/3,6:45/32,7:3/2,8:8/5,9:5/3,10:9/5,11:15/8};
function degCents(ti,letOff,semiFromRoot){
  if(ti===0)return 0;
  var sm=((semiFromRoot%12)+12)%12;
  if(ti===1)return 1200*Math.log(JUST_R[sm])/Math.LN2-sm*100;
  var fifth=ti===2?701.955:696.578, k;
  for(k=-12;k<=18;k++){
    if(((7*k)%12+12)%12===sm&&((4*k)%7+7)%7===letOff){
      var c=(((k*fifth)%1200)+1200)%1200, off=c-sm*100;
      if(off>600)off-=1200; if(off<=-600)off+=1200;
      return off;
    }
  }
  return 0;
}

/* ---------- state ---------- */
var hash=randHash();
var noteInst={}, keyHit={};   /* pitch instances per loop, for visualizer cores */
var S={harmony:0,tune:2,root:0,path:0,states:5,
       loop:0,voice:2};
var MAN={};
function eff(k){return MAN[k]!==undefined?MAN[k]:S[k];}
function dealAll(h){
  function D(tag,n){return cyrb53(h+tag)%n;}
  var x=(parseInt(h.slice(0,2),16)/256)*100,acc=0,hi=0;
  for(var i=0;i<PRESETS.length;i++){acc+=PRESETS[i].w;if(x<acc){hi=i;break;}}
  S.harmony=hi;
  S.root=D("root",12);
  S.path=D("path",11);
  S.states=3+D("states",6);
  S.loop=D("loop",3);
}

/* ---------- derived state ---------- */
var preset=PRESETS[0], scaleLen=5, dots=[], hbK=4, hbName="";
var STEP=27/24, LOOP_SEC=27, seq=[], pathPtr=0, strikeCount=0;
/* circle-of-fifths layers: strikes walk the melody frame by
   fifths (reset each loop, so loops stay consistent), and h=3
   fifth-ring strikes move the chord. playRoot/driftC are pinned
   to the dealt root: no travel, no drift. */
var walkF=0, chordHalf=0, loopChanges=0, playRoot=0, driftC=0, FIFTH_DEG=4;
function fifthStepDeg(){ var iv=ladderIv(),best=1,bd=1e9; for(var d=1;d<=12;d++){ var dd=Math.abs(degToSemi(d,iv)-7); if(dd<bd){bd=dd;best=d;} } return best; }
function baseMidi(){return 24+playRoot;}   /* series anchor: the C3 register — each dot's octave is dealt across C3-C4 in buildDots, locked for the series */
function curScaleLen(){return preset.cents?preset.cents.length:preset.iv.length;}
function ladderIv(){
  if(preset.iv)return preset.iv;
  return preset.cents.map(function(c){return c/100;});
}
function buildSeq(){
  var N=eff("states"),L=curScaleLen();
  var s=PATHS[eff("path")].gen(N,L,ladderIv());
  return s;
}
function applyState(){
  preset=PRESETS[eff("harmony")];
  scaleLen=curScaleLen();
  var fs=cyrb53(hash+"av");
  var hb=fs%10;
  hbK=hb<5?4:hb<8?3:2;   /* heartbeat = accent period in ticks: resting every 4th, active every 3rd, racing every 2nd */
  hbName=hb<5?"resting 60":hb<8?"active 82.5":"racing 105";
  LOOP_SEC=LOOPS[eff("loop")]; STEP=LOOP_SEC/24;
  seq=buildSeq(); pathPtr=0;
  FIFTH_DEG=fifthStepDeg();
  if(!playing)playRoot=eff("root");
}
var HARMS=[2,3,4,6,8,12];
var GA=Math.PI*(3-Math.sqrt(5));   /* golden angle: phyllotaxis spiral */
function buildDots(){
  var rnd=mulberry32(xmur3(hash)()), idx=0;
  dots=[];
  for(var r=0;r<4;r++)for(var i=0;i<RING_N[r];i++){
    var h=HARMS[Math.floor(rnd()*HARMS.length)];
    var dir=(r%2===0)?1:-1;
    var pk=Math.floor(rnd()*(24/h));   /* first peak lands on this tick */
    /* Fibonacci sphere: the phyllotaxis spiral wrapped on a ball —
       even height steps, golden-angle turns */
    var sy=1-2*(idx+0.5)/99, sr=Math.sqrt(Math.max(0,1-sy*sy)), st=idx*GA;
    /* the series octave is the C3-C4 blend: each dot's register is
       dealt — inner rings favor the low register, outer rings high */
    var blendHigh=rnd()*100<[25,50,50,75][r];
    dots.push({
      px:sr*Math.cos(st), py:sy, pz:sr*Math.sin(st),
      h:h, ph:0.25-dir*pk*h/24, dir:dir,
      oct:blendHigh?1:0,
      color:DOT_COLORS[Math.floor(rnd()*DOT_COLORS.length)], flash:-1e9
    });
    idx++;
  }
}
/* dot brightness: blink frequency = h x loop frequency, peaks on ticks */
function dotBright(d,el){
  var u=el/STEP*d.h/24;
  return 0.5+0.5*Math.sin(Math.PI*2*(d.dir*u+d.ph));
}
function degToSemi(deg,iv){
  var L=iv.length,o=Math.floor(deg/L),d=((deg%L)+L)%L;
  return iv[d]+12*o;
}
/* note for a degree: returns {f, mf|null} */
function noteFreq(deg,ringOct,half){
  var vr=preset.vamp[half], bm=baseMidi();
  if(preset.cents){
    var L=preset.cents.length, ci=((deg%L)+L)%L, co=Math.floor(deg/L);
    var cTot=vr*100+preset.cents[ci]+co*1200+ringOct*1200;
    var mf2=bm+cTot/100+driftC/100;
    return {f:mtof(mf2), mf:mf2};
  }
  var semi=degToSemi(deg,preset.iv), tot=vr+semi;
  var L=preset.iv.length, vdi=preset.iv.indexOf(vr);
  var lo=(preset.letOff[((deg%L)+L)%L]+preset.letOff[vdi])%7;
  var c=degCents(eff("tune"),lo,tot);
  var mf3=bm+ringOct*12+tot+c/100+driftC/100;
  return {f:mtof(mf3), mf:mf3};
}
function nameFor(pc,flat){return (flat?NAMES_F:NAMES_S)[((pc%12)+12)%12];}
function vampRootName(half,rp){return nameFor((rp===undefined?eff("root"):rp)+preset.vamp[half],preset.flat);}

/* ---------- synth ---------- */
var ctx=null, master, dryBus, fxSend, t0aud=0, tickN=0, timer=0, playing=false;
function mtof(mf){return 432*Math.pow(2,(mf-69)/12);}

/* ---------- MIDI out (Web MIDI) ----------
   Notes stream live: ch 1 main voice, ch 2 fifth-above, ch 3 bass.
   Pitch bend per note carries the spelled cents offset plus the
   A=432 concert offset (-31.77c vs A=440), inside the standard
   +/-200c bend range. Flam exports as a 45ms grace note; note-off
   gate is one tick (bass 3s). */
var midiAccess=null, midiOut=null;
function midiStatus(txt){ var el=document.getElementById("midiStatus"); if(el)el.textContent=txt; }
function midiWhen(t){ return performance.now()+(t-ctx.currentTime)*1000; }
function midiNote(mf,vel,t,gate,ch){
  if(!midiOut||mf===null||mf===undefined)return;
  var note=Math.round(mf); if(note<0||note>127)return;
  var bend=Math.round(8192+(((mf-note)*100-31.77)/200)*8192);
  bend=Math.max(0,Math.min(16383,bend));
  var w=midiWhen(t);
  try{
    midiOut.send([0xE0|ch, bend&0x7F, (bend>>7)&0x7F], w);
    midiOut.send([0x90|ch, note, Math.max(1,Math.min(127,Math.round(vel*127)))], w);
    midiOut.send([0x80|ch, note, 0], w+gate*1000);
  }catch(e){}
}
function setMIDIOut(o){ midiOut=o; if(o)midiStatus("MIDI out: sending to "+(o.name||o.id)+" — ch 1 main · ch 2 fifth · ch 3 bass"); }
function refreshMIDIList(){
  var sel=document.getElementById("midiSel"); if(!sel||!midiAccess)return;
  sel.innerHTML="";
  var outs=[]; midiAccess.outputs.forEach(function(o){ outs.push(o); });
  if(!outs.length){ sel.style.display="none"; midiOut=null; midiStatus("MIDI out: no outputs found (connect an interface or virtual port, e.g. IAC / loopMIDI)"); return; }
  outs.forEach(function(o){ var op=document.createElement("option"); op.value=o.id; op.textContent=o.name||o.id; sel.appendChild(op); });
  sel.style.display="";
  setMIDIOut(outs[0]);
  sel.onchange=function(){ midiAccess.outputs.forEach(function(o){ if(o.id===sel.value)setMIDIOut(o); }); };
}
function setupMIDI(){
  if(!navigator.requestMIDIAccess){ midiStatus("MIDI out: Web MIDI is not supported in this browser — use Chrome or Edge"); return; }
  navigator.requestMIDIAccess().then(function(acc){
    midiAccess=acc; acc.onstatechange=refreshMIDIList; refreshMIDIList();
    document.getElementById("midiBtn").textContent="🎹 MIDI OUT ON";
  }, function(){ midiStatus("MIDI out: access denied"); });
}
document.getElementById("midiBtn").onclick=setupMIDI;
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  /* mastering chain: master -> 24Hz cleanup -> glue comp -> brickwall limiter */
  master=ctx.createGain(); master.gain.value=0.85;
  var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=24; hp.Q.value=0.4;
  var cp=ctx.createDynamicsCompressor();
  cp.threshold.value=-18; cp.knee.value=18; cp.ratio.value=3; cp.attack.value=0.012; cp.release.value=0.24;
  var lim=ctx.createDynamicsCompressor();
  lim.threshold.value=-2.5; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=0.001; lim.release.value=0.2;
  master.connect(hp); hp.connect(cp); cp.connect(lim); lim.connect(ctx.destination);
  dryBus=ctx.createGain(); dryBus.gain.value=0.85; dryBus.connect(master);
  fxSend=ctx.createGain(); fxSend.gain.value=1.0; fxSend.connect(master);
  var n=ctx.sampleRate,len=Math.floor(n*1.8),imp=ctx.createBuffer(1,len,n),d=imp.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  var cv=ctx.createConvolver(); cv.buffer=imp;
  var vw=ctx.createGain(); vw.gain.value=0.32;

function pluck(mf,vel,t){  /* production voice, midiFloat in */
  var f=mtof(mf);
  var fl=ctx.createBiquadFilter(); fl.type="lowpass"; fl.Q.value=0.3;
  fl.frequency.value=1500+vel*3500;
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel*0.18,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+2.8);
  [[1,1.0],[2,0.25],[2.99,0.10]].forEach(function(p){
    var o=ctx.createOscillator(); o.type="sine"; o.frequency.value=f*p[0];
    var pg=ctx.createGain(); pg.gain.value=p[1];
    o.connect(pg); pg.connect(fl); o.start(t); o.stop(t+3.0);
  });

  var s=ctx.createGain(); s.gain.value=0.6; g.connect(s); s.connect(fxSend);
}
function throatNote(f,vel,t){
  var o=ctx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(f*0.965,t);
  o.frequency.linearRampToValueAtTime(f,t+0.16);
  var vib=ctx.createOscillator(); vib.frequency.value=4.6;
  var vg=ctx.createGain(); vg.gain.value=f*0.003; vib.connect(vg); vg.connect(o.frequency);
  var o2=ctx.createOscillator(); o2.type="sine"; o2.frequency.value=f*2;
  var g2=ctx.createGain(); g2.gain.value=0.12; o2.connect(g2);
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel*0.17,t+0.18);
  g.gain.setTargetAtTime(0.0001,t+0.18,0.8);
  o.connect(g); g2.connect(g); g.connect(dryBus);
  var se=ctx.createGain(); se.gain.value=0.55; g.connect(se); se.connect(fxSend);

function voiceStrike(nf,vel,t,flam){

     overtone is trimmed so the stack leaves headroom for the pluck. */
  if(v===1||v===2)throatNote(nf.f,vel*(v===2?0.85:1),t);
  if(v===0||v===2){ if(flam)pluck(nf.mf,vel,t-0.04); pluck(nf.mf,vel,t); }
}
function bassNote(half,t){  /* audition-only soft root at chord change */
  var vr=preset.vamp[half], bc=0;
  if(!preset.cents)bc=degCents(eff("tune"),preset.letOff[preset.iv.indexOf(vr)],vr);
  var bmf=baseMidi()+vr+bc/100+driftC/100;
  var f=mtof(bmf);
  midiNote(bmf,0.55,t,3.0,2);
  var o=ctx.createOscillator(); o.type="sine"; o.frequency.value=f;
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.10,t+0.3);
  g.gain.exponentialRampToValueAtTime(0.0001,t+3.0);
  o.connect(g); g.connect(dryBus);

function nextDeg(){
  var d=seq[pathPtr%seq.length]; pathPtr++; return d;
}
function doStrike(dotIdx,vel,t,half,degOv){
  var d=dots[dotIdx];
  var deg=(degOv!==undefined)?degOv:nextDeg();
  deg+=walkF;   /* the circle walk: strikes keep stepping this frame */
  var nf=noteFreq(deg,d.oct,half);
  voiceStrike(nf,vel,t,true);
  midiNote(nf.mf,vel,t-0.04,0.045,0); midiNote(nf.mf,vel,t,STEP,0);
  var nf2=noteFreq(SECONDS_T[2].f(deg,strikeCount),d.oct,half);  /* second voice: Fifth above, locked */
  voiceStrike(nf2,vel*0.6,t,true);
  midiNote(nf2.mf,vel*0.6,t-0.04,0.045,1); midiNote(nf2.mf,vel*0.6,t,STEP,1);
  /* record pitch instances for the visualizer cores: pitch key ->
     {loop, dots that played it, last-hit time} */
  var lp=Math.floor((t-t0aud)/LOOP_SEC);
  [nf.mf,nf2.mf].forEach(function(mf){
    var key=Math.round(mf*4), e=noteInst[key];
    if(!e||e.loop!==lp){ e=noteInst[key]={loop:lp,dots:{}}; }
    e.dots[dotIdx]=1; keyHit[key]=t-t0aud;
  });
  strikeCount++;
  d.flash=t-t0aud;
}
function scheduleTick(t,li){
  var lp=Math.floor((t-t0aud)/LOOP_SEC);
  /* form: loops are consistent — the token holds its dealt key and
     harmonic scale for every loop. (A traveling root that stepped
     +1 fifth per loop, comma accruing, was tried and removed
     2026-11-11 at Calvin's direction: consistent, not climbing.) */
  playRoot=eff("root");
  driftC=0;
  var el=t-t0aud, cand=[];
  for(var i=0;i<dots.length;i++){
    var d=dots[i];
    var b=dotBright(d,el);
    /* tiny hash tiebreak (+<0.005): ~24 dots peak simultaneously on the
       harmonic grid, and a plain sort resolves that tie in index order —
       inner rings first, outer rings never. Genuinely brighter dots
       still win; equals now rotate fairly, per token and tick. */
    if(b>0.88)cand.push({i:i,b:b+(cyrb53(hash+"tie"+li+"_"+i)%1000)/1000*0.005});
  }
  cand.sort(function(a,b){return b.b-a.b;});
  function nowLine(){
    var nowEl=document.getElementById("now");
    if(nowEl)nowEl.innerHTML='loop <b>'+(lp+1)+'</b> · key <b>'+nameFor(playRoot,preset.flat)+'</b> · <b class="chord">'+vampRootName(chordHalf,playRoot)+'</b> <span class="note">('+preset.vampN+')</span>';
  }
  if(li===0){ chordHalf=0; loopChanges=0; walkF=0; bassNote(0,t); nowLine(); }
  else if(li===12){
    /* the chord has exactly one decision point: the midpoint. If
       the fifth ring aligns there (at least 3 of the h=3 dots at
       exact peak), the chord steps and the bass follows; otherwise
       one chord holds the whole loop. The alignment is loop-
       periodic, so each token's answer is a dealt trait. */
    var ringN=0;
    for(var ri=0;ri<dots.length;ri++)if(dots[ri].h===3&&dotBright(dots[ri],el)>0.99)ringN++;
    if(ringN>=3){
      chordHalf=1-chordHalf; loopChanges++;
      bassNote(chordHalf,t); nowLine();
    }
  }
  var sw=(li%hbK===0)?2.2:0.7, votes=0;
  if(cand.length){
    for(var k=0;k<Math.min(2,cand.length);k++){ doStrike(cand[k].i,0.9*sw,t,chordHalf); votes+=dots[cand[k].i].dir; }
  }else{
    var fi2=cyrb53(hash+"fl"+li)%dots.length;
    doStrike(fi2,0.3*sw,t,chordHalf,nextDeg()); votes+=dots[fi2].dir;
  }
  /* layer 2 — notes: the tick's strikes vote the melody frame one
     fifth up or down the circle (a tie holds); reflected inside
     [-1, +2] fifths of home so it wanders without leaving home */
  if(votes>0)walkF+=FIFTH_DEG; else if(votes<0)walkF-=FIFTH_DEG;
  if(walkF>2*FIFTH_DEG)walkF=4*FIFTH_DEG-walkF;
  if(walkF<-FIFTH_DEG)walkF=-2*FIFTH_DEG-walkF;
}
function pump(){
  if(!timer)return;
  var now=ctx.currentTime;
  while(t0aud+tickN*STEP<now+0.5){
    var tt=t0aud+tickN*STEP;
    if(tt>=now-0.1)scheduleTick(tt,tickN%24);
    tickN++;
  }
  timer=setTimeout(pump,50);
}

/* ---------- visuals ---------- */
var cv=document.getElementById("cv"), cx2d=cv.getContext("2d"), glowSprites={}, lastDraw=0;
function glowSprite(color){
  if(glowSprites[color])return glowSprites[color];
  var s=document.createElement("canvas"); s.width=s.height=64;
  var g=s.getContext("2d"), gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,color); gr.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  glowSprites[color]=s; return s;
}
function draw(ts){
  requestAnimationFrame(draw);
  if(ts&&lastDraw&&ts-lastDraw<33)return;
  lastDraw=ts||0;
  var W=cv.width,H=cv.height,CX=W/2,CY=H/2,R=Math.min(W,H)/2;
  cx2d.fillStyle="#000"; cx2d.fillRect(0,0,W,H);
  var el=playing?(ctx.currentTime-t0aud):(performance.now()/1000%LOOP_SEC);
  /* The field lives on an invisible sphere (Fibonacci lattice),
     spinning about an axis halfway between its pole and the view
     axis: the ball rolls clockwise on screen while every dot cycles
     between the near and far side. One revolution per loop, so the
     sphere returns to its starting orientation as the music does.
     Project each dot, thread the spiral by depth, paint far side
     first. */
  var spin=-(playing?(ctx.currentTime-t0aud):performance.now()/1000)*(Math.PI*2/LOOP_SEC);  /* one revolution per loop */
  var cf=Math.cos(spin), sf=Math.sin(spin), ct=Math.cos(0.42), stt=Math.sin(0.42);
  /* sphere packs at 0.55 of frame, then the view zooms x1.6 so the
     ball fills the frame again (0.88) — dots grow with the zoom,
     which is what tightens the packing */
  var ZOOM=1.6, SR=R*0.55*ZOOM;
  var AY=0.70711, AZ=0.70711;   /* spin axis (0, AY, AZ), unit */
  var proj=[];
  for(var pi=0;pi<dots.length;pi++){
    var pd=dots[pi];
    var dt=AY*pd.py+AZ*pd.pz;                                  /* axis . p */
    var cx1=AY*pd.pz-AZ*pd.py, cy1=AZ*pd.px, cz1=-AY*pd.px;    /* axis x p */
    var rx=pd.px*cf+cx1*sf,
        ry0=pd.py*cf+cy1*sf+AY*dt*(1-cf),
        rz0=pd.pz*cf+cz1*sf+AZ*dt*(1-cf);
    var ry=ry0*ct-rz0*stt, rz2=ry0*stt+rz0*ct;       /* presentation tilt about X */
    proj.push({i:pi, x:CX+rx*SR, y:CY-ry*SR, z:rz2});
  }
  cx2d.lineWidth=1;
  for(var gi=1;gi<proj.length;gi++){
    var gz=(proj[gi-1].z+proj[gi].z)/2;
    cx2d.strokeStyle="rgba(255,255,255,"+(0.05+0.13*(gz*0.5+0.5)).toFixed(3)+")";
    cx2d.beginPath(); cx2d.moveTo(proj[gi-1].x,proj[gi-1].y); cx2d.lineTo(proj[gi].x,proj[gi].y); cx2d.stroke();
  }
  var order=proj.slice().sort(function(a,b2){return a.z-b2.z;});
  var curLp=Math.floor(el/LOOP_SEC);
  for(var oi=0;oi<order.length;oi++){
    var pr=order[oi], i=pr.i;
    var d=dots[i], b=dotBright(d,el);
    var dScale=0.55+0.45*(pr.z*0.5+0.5), dAlpha=0.30+0.70*(pr.z*0.5+0.5);
    /* wiggle: tiny circle at the dot's own harmonic rate, phase-locked
       to its blink — it is at the top of its sway at every peak */
    var wp=Math.PI*2*(d.dir*el/LOOP_SEC*d.h+d.ph);
    var x=pr.x+Math.cos(wp)*3.5*ZOOM,
        y=pr.y+Math.sin(wp)*3.5*ZOOM, rad=(2+3*b)*dScale*ZOOM;
    cx2d.globalAlpha=(0.25+0.75*b)*dAlpha;
    var gs=rad*6;
    cx2d.drawImage(glowSprite(d.color),x-gs/2,y-gs/2,gs,gs);
    cx2d.globalAlpha=dAlpha; cx2d.fillStyle=d.color;
    cx2d.beginPath(); cx2d.arc(x,y,rad*0.7,0,7); cx2d.fill();
    var since=el-d.flash;
    if(since>=0){
      /* ripple train: 3 rings per strike, staggered 0.22s, each
         expanding and fading over 0.9s, later rings fainter */
      for(var rp=0;rp<3;rp++){
        var s2=since-rp*0.22;
        if(s2<0||s2>=0.9)continue;
        cx2d.globalAlpha=(1-s2/0.9)*(1-rp*0.25)*dAlpha; cx2d.strokeStyle=d.color; cx2d.lineWidth=1.5;
        cx2d.beginPath(); cx2d.arc(x,y,rad+s2*46*dScale*ZOOM,0,7); cx2d.stroke();
      }
      cx2d.globalAlpha=1;
    }
    /* Tidal-style core: a struck dot gets a grey core (#75808f, 60%)
       with a near-black pinprick (#0b0b0b, 38% of the core). While a
       pitch is within its tick, every other dot that played that same
       pitch this loop shows the core too, dimmer — its instances. */
    var coreA=0;
    if(since>=0&&since<0.9)coreA=1-(since/0.9)*0.3;
    else{
      for(var kk in keyHit){
        if(el-keyHit[kk]<STEP&&noteInst[kk]&&noteInst[kk].loop===curLp&&noteInst[kk].dots[i]){ coreA=0.55; break; }
      }
    }
    if(coreA>0){
      cx2d.globalAlpha=coreA*dAlpha; cx2d.fillStyle="#75808f";
      cx2d.beginPath(); cx2d.arc(x,y,rad*0.6,0,7); cx2d.fill();
      cx2d.fillStyle="#0b0b0b";
      cx2d.beginPath(); cx2d.arc(x,y,rad*0.6*0.38,0,7); cx2d.fill();
      cx2d.globalAlpha=1;
    }
  }
}

    t0aud=ctx.currentTime+0.1; tickN=0; pathPtr=0; strikeCount=0;
    walkF=0; chordHalf=0; loopChanges=0;
    playBtn.textContent="⏸ STOP"; playBtn.classList.add("playing");
    timer=setTimeout(pump,50);
  }else{ playBtn.textContent="▶ PLAY"; playBtn.classList.remove("playing");
    if(timer){clearTimeout(timer);timer=0;} }
};
document.getElementById("newBtn").onclick=function(){
  hash=randHash(); MAN={}; dealAll(hash);
  walkF=0; chordHalf=0; loopChanges=0;
  buildDots(); applyState(); syncUI(); refreshReadout();
};

dealAll(hash);
applyState(); buildDots(); syncUI(); refreshReadout();
draw();
</script>
