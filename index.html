<script>
"use strict";
/* ============================================================
   HASH-SEED HARMONIC SYNTHESIZER — one hash deals one token.
   99 dots on a Fibonacci sphere blink at integer harmonics of
   the loop frequency (h in {2,3,4,6,8,12}, dealt freely per
   dot), peaks phase-locked to the 24-tick grid; the top-2
   strikes per tick play the hash-dealt pattern melody.
   Locked for the series: voice Both (pluck + throat layered,
   40ms flam on every strike), second voice a fifth above,
   Pythagorean tuning at A=432Hz, the octave a C3-C4 blend
   dealt per dot, loops consistent — the token holds its dealt
   key and harmonic scale, strikes walk the melody frame by
   fifths and reset each loop, the chord steps at the midpoint
   when the fifth ring aligns. Loop tempos are 54 / 40 / 32
   BPM at one tick per beat (26.7 / 36 / 45s), root dealt (12).
   ============================================================ */

function xmur3(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cyrb53(str,seed){var h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function randHash(){var s="",c="0123456789abcdef";for(var i=0;i<64;i++)s+=c[Math.floor(Math.random()*16)];return s;}

/* ---------- tables ---------- */
var PRESETS=[
 {n:"Sunline",       w:20, iv:[0,2,4,7,9],          names:"D E F# A B",       vamp:[0,9], vampN:"I–vi",  flat:false},
 {n:"Lydian lift",   w:20, iv:[0,2,4,6,7,9,11],     names:"D E F# G# A B C#", vamp:[0,2], vampN:"I–II",  flat:false},

  var cf=Math.cos(spin), sf=Math.sin(spin), ct=Math.cos(0.42), stt=Math.sin(0.42);
  /* sphere packs at 0.55 of frame, then the view zooms x1.6 so the
     ball fills the frame again (0.88) — dots grow with the zoom,
     which is what tightens the packing */
  var ZOOM=1.408, SR=R*0.55*ZOOM;
  var AY=0.70711, AZ=0.70711;   /* spin axis (0, AY, AZ), unit */
  var proj=[];
  for(var pi=0;pi<dots.length;pi++){
    var pd=dots[pi];
    var dt=AY*pd.py+AZ*pd.pz;                                  /* axis . p */
    var cx1=AY*pd.pz-AZ*pd.py, cy1=AZ*pd.px, cz1=-AY*pd.px;    /* axis x p */
    var rx=pd.px*cf+cx1*sf,
        ry0=pd.py*cf+cy1*sf+AY*dt*(1-cf),
        rz0=pd.pz*cf+cz1*sf+AZ*dt*(1-cf);
    var ry=ry0*ct-rz0*stt, rz2=ry0*stt+rz0*ct;       /* presentation tilt about X */
    proj.push({i:pi, x:CX+rx*SR, y:CY-ry*SR, z:rz2});
  }
  cx2d.lineWidth=1;
  for(var gi=1;gi<proj.length;gi++){
    var gz=(proj[gi-1].z+proj[gi].z)/2;
    cx2d.strokeStyle="rgba(255,255,255,"+(0.05+0.13*(gz*0.5+0.5)).toFixed(3)+")";
    cx2d.beginPath(); cx2d.moveTo(proj[gi-1].x,proj[gi-1].y); cx2d.lineTo(proj[gi].x,proj[gi].y); cx2d.stroke();
  }
  var order=proj.slice().sort(function(a,b2){return a.z-b2.z;});
  var curLp=Math.floor(el/LOOP_SEC);
  for(var oi=0;oi<order.length;oi++){
    var pr=order[oi], i=pr.i;
    var d=dots[i], b=dotBright(d,el);
    var dScale=0.55+0.45*(pr.z*0.5+0.5), dAlpha=0.30+0.70*(pr.z*0.5+0.5);
    /* wiggle: tiny circle at the dot's own harmonic rate, phase-locked
       to its blink — it is at the top of its sway at every peak */
    var wp=Math.PI*2*(d.dir*el/LOOP_SEC*d.h+d.ph);
    var x=pr.x+Math.cos(wp)*3.5*ZOOM,
        y=pr.y+Math.sin(wp)*3.5*ZOOM, rad=(2+3*b)*dScale*ZOOM;
    cx2d.globalAlpha=(0.25+0.75*b)*dAlpha;
    var gs=rad*6;
    cx2d.drawImage(glowSprite(d.color),x-gs/2,y-gs/2,gs,gs);
    cx2d.globalAlpha=dAlpha; cx2d.fillStyle=d.color;
    cx2d.beginPath(); cx2d.arc(x,y,rad*0.7,0,7); cx2d.fill();
    var since=el-d.flash;
    if(since>=0){
      /* ripple train: 3 rings per strike, staggered 0.22s, each
         expanding and fading over 0.9s, later rings fainter */
      for(var rp=0;rp<3;rp++){
        var s2=since-rp*0.22;
        if(s2<0||s2>=0.9)continue;
        cx2d.globalAlpha=(1-s2/0.9)*(1-rp*0.25)*dAlpha; cx2d.strokeStyle=d.color; cx2d.lineWidth=1.5;
        cx2d.beginPath(); cx2d.arc(x,y,rad+s2*46*dScale*ZOOM,0,7); cx2d.stroke();
      }
      cx2d.globalAlpha=1;
    }
    /* Tidal-style core: a struck dot gets a grey core (#75808f, 60%)
       with a near-black pinprick (#0b0b0b, 38% of the core). While a
       pitch is within its tick, every other dot that played that same
       pitch this loop shows the core too, dimmer — its instances. */
    var coreA=0;
    if(since>=0&&since<0.9)coreA=1-(since/0.9)*0.3;
    else{
      for(var kk in keyHit){
        if(el-keyHit[kk]<STEP&&noteInst[kk]&&noteInst[kk].loop===curLp&&noteInst[kk].dots[i]){ coreA=0.55; break; }
      }
    }
    if(coreA>0){
      cx2d.globalAlpha=coreA*dAlpha; cx2d.fillStyle="#75808f";
      cx2d.beginPath(); cx2d.arc(x,y,rad*0.6,0,7); cx2d.fill();
      cx2d.fillStyle="#0b0b0b";
      cx2d.beginPath(); cx2d.arc(x,y,rad*0.6*0.38,0,7); cx2d.fill();
      cx2d.globalAlpha=1;
    }
  }
}

/* ---------- UI ---------- */
function mkRow(id,items,cur,fmt,dis){
  var el=document.getElementById(id); el.innerHTML="";
  items.forEach(function(it,i){
    var b=document.createElement("button");
    b.innerHTML=fmt?fmt(it,i):it;
    if(dis&&dis(i))b.disabled=true;
    if(i===cur)b.classList.add("on");
    b.onclick=function(){pick(id,i);};
    el.appendChild(b);
  });
}
/* ---- visual builders: the graphic IS the explanation ---- */
function buildKeyboard(){
  /* abstract keyboard: piano geometry kept, rendered in the page theme —
     dark keys, grey labels, a field dot per key, spectrum glow on selection */
  var el=document.getElementById("rootRow"); el.innerHTML="";
  var kb=document.createElement("div");
  kb.style.cssText="position:relative;width:252px;height:58px;";
  var cur=eff("root");
  function keyInner(pc,small){
    var dc=DOT_COLORS[pc%DOT_COLORS.length], sel=pc===cur;
    return '<div style="width:'+(small?4:6)+'px;height:'+(small?4:6)+'px;border-radius:50%;background:'+(sel?"#000":dc)+';opacity:'+(sel?0.8:0.55)+'"></div>'+
           '<div>'+NAMES_S[pc]+'</div>';
  }
  [0,2,4,5,7,9,11].forEach(function(pc,wi){
    var k=document.createElement("div"), sel=pc===cur, dc=DOT_COLORS[pc%DOT_COLORS.length];
    k.style.cssText="position:absolute;bottom:0;left:"+(wi*36+1)+"px;width:33px;height:56px;border-radius:6px;cursor:pointer;box-sizing:border-box;"+
      "border:1px solid "+(sel?dc:"#3a3a3a")+";background:"+(sel?dc:"#1a1a1a")+";color:"+(sel?"#000":"#8a8578")+";"+
      "box-shadow:"+(sel?"0 0 14px "+hexA(dc,0.45):"none")+";font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0 3px;font-family:monospace;";
    k.innerHTML=keyInner(pc,false);
    k.onclick=function(){pick("rootRow",pc);};
    kb.appendChild(k);
  });
  var afterWhite={1:0,3:1,6:3,8:4,10:5};
  [1,3,6,8,10].forEach(function(pc){
    var wi=afterWhite[pc], sel=pc===cur, dc=DOT_COLORS[pc%DOT_COLORS.length];
    var k=document.createElement("div");
    k.style.cssText="position:absolute;top:0;left:"+((wi+1)*36-11)+"px;width:22px;height:34px;border-radius:5px;cursor:pointer;box-sizing:border-box;z-index:2;"+
      "border:1px solid "+(sel?dc:"#3a3a3a")+";background:"+(sel?dc:"#0a0a0a")+";color:"+(sel?"#000":"#8a8578")+";"+
      "box-shadow:"+(sel?"0 0 12px "+hexA(dc,0.5):"none")+";font-size:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0 2px;font-family:monospace;";
    k.innerHTML=keyInner(pc,true);
    k.onclick=function(){pick("rootRow",pc);};
    kb.appendChild(k);
  });
  el.appendChild(kb);
}
function clockSVG(p,i){
  var col=PRESET_COLORS[i];
  var tones=p.iv.map(function(s){return s/12;});
  var cx=23, cy=23, R=17, s="";
  var pts=tones.map(function(f){var a=f*Math.PI*2-Math.PI/2;return [cx+Math.cos(a)*R, cy+Math.sin(a)*R];});
  s+='<circle cx="23" cy="23" r="20" fill="none" stroke="#2a2a2a" stroke-width="1"/>';
  if(pts.length>2)s+='<polygon points="'+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ")+'" fill="'+hexA(col,0.10)+'" stroke="'+hexA(col,0.55)+'" stroke-width="1"/>';
  for(var pc=0;pc<12;pc++){var a=pc/12*Math.PI*2-Math.PI/2;
    s+='<circle cx="'+(cx+Math.cos(a)*R).toFixed(1)+'" cy="'+(cy+Math.sin(a)*R).toFixed(1)+'" r="1.4" fill="#3a3a3a"/>';}
  pts.forEach(function(q){s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.7" fill="'+col+'"/>';});
  return '<svg width="46" height="46">'+s+'</svg>';
}
function buildHarmRow(){
  var el=document.getElementById("harmRow"); el.innerHTML="";
  PRESETS.forEach(function(p,i){
    var b=document.createElement("button");
    b.classList.add("vbtn");
    if(i===eff("harmony"))b.classList.add("on");
    b.innerHTML='<div>'+p.n+' <span class="wt">'+p.w+'</span></div>'+clockSVG(p,i)+
      '<div class="track"><div class="fill" style="width:'+p.w+'%;background:'+PRESET_COLORS[i]+'"></div></div>';
    b.onclick=function(){pick("harmRow",i);};
    el.appendChild(b);
  });
}
function buildLoopRow(){
  var el=document.getElementById("loopRow"); el.innerHTML="";
  LOOPS.forEach(function(bpm,i){
    var b=document.createElement("button");
    b.classList.add("vbtn");
    if(i===eff("loop"))b.classList.add("on");
    var wpx=Math.round(bpm/54*76);
    b.innerHTML='<div>'+bpm+' BPM</div><div class="track" style="width:76px"><div class="fill" style="width:'+wpx+'px;background:'+DOT_COLORS[i%DOT_COLORS.length]+'"></div></div>';
    b.onclick=function(){pick("loopRow",i);};
    el.appendChild(b);
  });
}
var KEYMAP={rootRow:"root",harmRow:"harmony",
  pathRow:"path",statesRow:"states",loopRow:"loop"};
var VALMAP={states:[3,4,5,6,7,8]};
function pick(id,i){
  var k=KEYMAP[id];
  MAN[k]=VALMAP[k]?VALMAP[k][i]:i;
  if(k==="harmony")buildDots();
  applyState(); syncUI(); refreshReadout();
}
function syncUI(){
  buildKeyboard();
  buildHarmRow();
  mkRow("pathRow",PATHS.map(function(p){return p.n;}),eff("path"));
  mkRow("statesRow",[3,4,5,6,7,8],eff("states")-3);
  buildLoopRow();
}
function drawSeq(){
  var c=document.getElementById("seqCv"); if(!c||!seq.length)return;
  var g=c.getContext("2d"), W=c.width, H=c.height;
  g.fillStyle="#000"; g.fillRect(0,0,W,H);
  /* one fixed frame shared by every pattern at this note count —
     the tallest pattern sets the top — so the drawing shows each
     melody's true steepness instead of stretching it to fill the box */
  var N2=eff("states"), L2=curScaleLen(), gmax=1;
  PATHS.forEach(function(p){ var gs2=p.gen(N2,L2,ladderIv()); for(var gi=0;gi<gs2.length;gi++)if(gs2[gi]>gmax)gmax=gs2[gi]; });
  var pad=16, iw=W-2*pad, ih=H-2*pad-6;
  function pt(d,i){
    return [pad+(seq.length===1?iw/2:iw*i/(seq.length-1)), pad+ih*(1-d/gmax)];
  }
  g.strokeStyle=hexA("#00f0ff",0.55); g.lineWidth=1.5; g.beginPath();
  seq.forEach(function(d,i){ var p=pt(d,i); if(i===0)g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]); });
  g.stroke();
  seq.forEach(function(d,i){
    var p=pt(d,i);
    g.fillStyle=DOT_COLORS[i%DOT_COLORS.length]; g.beginPath(); g.arc(p[0],p[1],4,0,7); g.fill();
    g.fillStyle="rgba(232,228,216,0.65)"; g.font="9px monospace"; g.textAlign="center";
    g.fillText(d,p[0],p[1]-8);
  });
}
function refreshReadout(){
  var manual=Object.keys(MAN).length>0;
  var pat=preset.iv.join(" ");
  var mel=PATHS[eff("path")].n+" · "+eff("states")+" notes <span class='note'>["+seq.join(" ")+"]</span>";
  document.getElementById("readout").innerHTML=
    'token <b>'+hash.slice(0,12)+'…</b> '+(manual?'<span class="note">(manual override)</span>':'<span class="note">(hash-dealt)</span>')+'<br>'+
    'root <b class="trait">'+nameFor(eff("root"),preset.flat)+'</b> · C3–C4<br>'+
    'harmony <b class="trait">'+preset.n+'</b> <span class="wt">'+preset.w+'%</span> · scale <b>'+pat+'</b> <span class="note">(at D: '+preset.names+')</span><br>'+
    'vamp <b class="chord">'+vampRootName(0)+' → '+vampRootName(1)+'</b> <span class="note">('+preset.vampN+')</span><br>'+
    'melody <b class="trait">'+mel+'</b><br>'+
    'loop <b class="trait">'+LOOPS[eff("loop")]+' BPM</b><br>'+
    '<span id="now"></span>';
  drawSeq();
}
var playBtn=document.getElementById("playBtn");
playBtn.onclick=function(){
  if(!ctx)initAudio();
  if(ctx.state==="suspended")ctx.resume();
  playing=!playing;
  if(playing){
    applyState();
    t0aud=ctx.currentTime+0.1; tickN=0; pathPtr=0;
    walkF=0; chordHalf=0;
    playBtn.textContent="⏸ STOP"; playBtn.classList.add("playing");
    timer=setTimeout(pump,50);
  }else{ playBtn.textContent="▶ PLAY"; playBtn.classList.remove("playing");
    if(timer){clearTimeout(timer);timer=0;} }
};
/* leaving the tab stops the music — no background playback */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&playing)playBtn.onclick();
});
document.getElementById("newBtn").onclick=function(){
  hash=randHash(); MAN={}; dealAll(hash);
  walkF=0; chordHalf=0;
  buildDots(); applyState(); syncUI(); refreshReadout();
};

dealAll(hash);
applyState(); buildDots(); syncUI(); refreshReadout();
draw();
</script>
